name: aiopsdesk

services:
  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pull_policy: never
    profiles: ["observe"]
    restart: unless-stopped
    read_only: true
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
    volumes:
      - /:/host:ro,rslave
    networks:
      - app_access
    cpus: "0.25"
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  reports-exporter:
    image: aiopsdesk-reports:monitoring-001
    pull_policy: never
    profiles: ["observe"]
    init: true
    restart: unless-stopped
    read_only: true
    command: ["python", "/exporter/reports_exporter.py"]
    volumes:
      - ./monitoring/exporters/reports_exporter.py:/exporter/reports_exporter.py:ro
      - ./reports:/reports:ro
    networks:
      - app_access
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:9108/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    cpus: "0.25"
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  blackbox:
    image: prom/blackbox-exporter@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    pull_policy: never
    profiles: ["observe"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - app_internal
      - app_access
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    cpus: "0.25"
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    pull_policy: never
    profiles: ["observe"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    environment:
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
      GF_METRICS_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/ray:/var/lib/grafana/ray:ro
    networks:
      - app_access
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    cpus: 0.5
    mem_limit: 768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    pull_policy: never
    profiles: ["observe"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/ray:/etc/prometheus/ray:ro
      - prometheus_data:/prometheus
    networks:
      - app_internal
      - app_access
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    cpus: 0.5
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  frontend:
    image: aiopsdesk-frontend:dev
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    ports:
      - "127.0.0.1:3002:8080"
    networks:
      - app_access
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  model:
    image: aiopsdesk-model:candidate-001-explained
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    expose:
      - "5001"
    networks:
      - app_internal
    cpus: 1.0
    mem_limit: 1536m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: aiopsdesk-api:dev
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    environment:
      AIOPS_MODEL_URL: http://model:5001
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/state/app
    networks:
      - app_internal
      - app_access
    depends_on:
      model:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  app_internal:
    internal: true
  app_access:
    driver: bridge

volumes:
  grafana_data: {}
  prometheus_data: {}
  app_data:
    external: true
    name: aiopsdesk_app_data
