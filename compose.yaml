name: aiopsdesk

services:
  frontend:
    image: aiopsdesk-frontend:dev
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    ports:
      - "127.0.0.1:3002:8080"
    networks:
      - app_access
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  model:
    image: aiopsdesk-model:candidate-001
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    expose:
      - "5001"
    networks:
      - app_internal
    cpus: 1.0
    mem_limit: 1536m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: aiopsdesk-api:dev
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    environment:
      AIOPS_MODEL_URL: http://model:5001
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/state/app
    networks:
      - app_internal
      - app_access
    depends_on:
      model:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  app_internal:
    internal: true
  app_access:
    driver: bridge

volumes:
  app_data:
    external: true
    name: aiopsdesk_app_data
