groups:
  - name: aiopsdesk-availability
    rules:
      - alert: AIOpsDeskServiceUnavailable
        expr: |
          (probe_success{job="aiopsdesk-http-probes"} == 0)
          or
          (up{job="aiopsdesk-http-probes"} == 0)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} availability check failed"
          description: "The HTTP probe failed or could not be collected for at least 30 seconds. Check the service and Blackbox Exporter."
