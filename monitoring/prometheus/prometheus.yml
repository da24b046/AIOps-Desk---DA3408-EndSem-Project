global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: aiopsdesk-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: blackbox
    static_configs:
      - targets:
          - blackbox:9115

  - job_name: aiopsdesk-http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://frontend:8080/health/live"]
        labels:
          service: frontend
      - targets: ["http://api:8000/health/ready"]
        labels:
          service: api
      - targets: ["http://model:5001/ping"]
        labels:
          service: model
      - targets: ["http://grafana:3000/api/health"]
        labels:
          service: grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: reports-exporter
    static_configs:
      - targets: ["reports-exporter:9108"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

rule_files:
  - /etc/prometheus/alerts.yml
